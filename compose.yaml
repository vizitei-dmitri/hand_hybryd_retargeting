name: dg5f-hybrid-retargeting

services:
  hybrid_hand:
    image: dg5f-hybrid-retargeting:humble
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      QT_X11_NO_MITSHM: "1"
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-110}
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
