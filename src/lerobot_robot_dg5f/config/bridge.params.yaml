dg5f_lerobot_bridge:
  ros__parameters:
    command_topic: /dg5f/joint_command
    tracking_topic: /dg5f/tracking_ok
    joint_state_topic: /dg5f/lerobot/joint_states
    commanded_state_topic: /dg5f/lerobot/commanded_joint_states
    temperature_topic: /dg5f/lerobot/temperatures
    connected_topic: /dg5f/lerobot/connected
    armed_topic: /dg5f/lerobot/armed
    diagnostics_topic: /dg5f/lerobot/diagnostics
    enable_service: /dg5f/lerobot/enable
    recover_service: /dg5f/lerobot/recover
    backend: mock
    ip: 169.254.186.72
    port: 502
    slave_id: 1
    command_rate_hz: 50.0
    state_rate_hz: 30.0
    command_timeout: 0.35
    tracking_timeout: 0.35
    # After an already-armed hand loses Quest tracking, keep the physical hand
    # at the last accepted pose for up to 15 s. If tracking returns in time,
    # resume automatically through a smooth catch-up blend; no new ARM needed.
    tracking_grace_s: 15.0
    tracking_resume_blend_s: 1.0
    # Manual ARM and automatic resume both reseed once from fresh physical pose.
    arm_pose_max_age_ms: 100.0
    # Adaptive software load guard. This is an EXTRA envelope above the normal
    # Tesollo/DGSDK/firmware protections; it does not disable or replace them.
    # Thresholds are conservative empirical values from our debug runs, not
    # Tesollo's published absolute motor limits. The latest reset happened near
    # 1.2-1.27 A total, so total-load limiting now starts substantially earlier.
    current_guard_enabled: true
    current_guard_soft_ma: 350.0
    current_guard_hard_ma: 650.0
    current_guard_trip_ma: 850.0
    current_guard_total_soft_ma: 600.0
    current_guard_total_hard_ma: 850.0
    current_guard_total_trip_ma: 1050.0
    current_guard_trip_hold_s: 0.04
    # Restriction attacks immediately but releases over 0.2 s to avoid chatter.
    current_guard_release_tau_s: 0.20
    # Reference: hand_hybryd_retargeting_3.zip + dg5f_current_guard_v2.patch.
    # Baseline 2026-09-08 12:49: direct_guarded + current_guard_v2.
    # Contact/FK are DEBUG ONLY.
    # All experimental trajectory parameters below are inert in the ROS bridge;
    # neither setting enabled=true nor contact packets can rewire control.
    compliance_enabled: false
    hybrid_contact_topic: /dg5f/hybrid_contact
    safety_proximity_topic: /dg5f/safety_proximity
    compliance_contact_timeout_s: 0.15
    compliance_urdf_path: /workspace/models/dg5f/urdf/dg5f_right.urdf
    compliance_joint_slope_soft_ma_s: 800.0
    compliance_joint_slope_hard_ma_s: 3500.0
    compliance_total_slope_soft_ma_s: 1200.0
    compliance_total_slope_hard_ma_s: 5000.0
    compliance_slope_filter_tau_s: 0.05
    compliance_slope_max_reduction: 0.8
    compliance_contact_preemptive_reduction: 0.12
    compliance_contact_current_start_ma: 100.0
    compliance_lead_min_deg: 1.0
    compliance_lead_max_deg: 8.0
    compliance_thumb_contact_start_m: 0.055
    compliance_thumb_contact_full_m: 0.025
    compliance_adjacent_contact_start_m: 0.030
    compliance_adjacent_contact_full_m: 0.012
    # Robot URDF tip-to-tip distances, NOT MANO distances. Empirical starting
    # values for this prototype; human pinch intent alone never slows motion.
    compliance_thumb_index_contact_distance_mm: 25.0
    compliance_thumb_index_slowdown_start_mm: 35.0
    # Short SOFT response only. Hard current/faults and TI boundary stay immediate.
    compliance_soft_attack_tau_s: 0.03
    compliance_soft_release_tau_s: 0.06
    # Non-TI contact requires load and can never geometrically force scale=0.
    compliance_other_contact_max_reduction: 0.5
    # Confirm stationary moderate load before slowly shedding existing lead.
    compliance_yield_enabled: false
    compliance_yield_current_ma: 240.0
    compliance_yield_error_deg: 4.0
    compliance_yield_velocity_deg_s: 1.0
    compliance_yield_hold_s: 0.25
    compliance_yield_rate_deg_s: 5.0
    # Additional sustained-stall backstop; does not replace fast current trip.
    compliance_stall_enabled: false
    compliance_stall_current_ma: 350.0
    compliance_stall_error_deg: 8.0
    compliance_stall_velocity_deg_s: 0.5
    compliance_stall_hold_s: 0.5
    control_smoothing: false  # direct profile: no artificial speed/acceleration ramp
    max_speed_deg_s: 30.0
    max_accel_deg_s2: 60.0
    response_time_s: 0.15
    filter_tau_s: 0.05
    target_deadband_deg: 0.20
    min_send_step_deg: 0.0
    # Direct mode remains fast, but one 50 Hz command may move a joint by at
    # most 5 deg (~250 deg/s equivalent). This blocks 50-90 deg one-frame jumps.
    max_direct_step_deg: 5.0
    # On each ARM, blend from the last accepted physical setpoint toward the
    # live VR target before entering fully direct tracking.
    startup_blend_s: 0.70
    max_dt_s: 0.05
    initial_feedback_timeout_s: 2.0
    telemetry_drain_limit: 16
    # Deprecated compatibility option; no longer used for smoothing.
    max_relative_target_deg: 7.0
    auto_enable: false
    require_tracking: true
    disabled_joints: [rj_dg_5_1]
    disabled_positions_deg: [0.0]
