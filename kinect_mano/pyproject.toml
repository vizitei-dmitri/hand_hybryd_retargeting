[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinect-mano"
version = "0.1.0"
description = "Calibrated dual RGB-D MANO parameter fitting and temporal reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.2,<3", "opencv-contrib-python>=4.8,<5", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
mediapipe = ["mediapipe>=0.10.20,<0.11"]
kinect = ["pyk4a>=1.5,<2"]

[project.scripts]
kinect-mano = "kinect_mano.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kinect_mano*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
